DESCRIPTION="Tracearr: who's watching what on Plex or Jellyfin, with its own Tailscale node (tailnet-only)"
KIND=optional
PROJECT=media-stack
REQUIRES="media-stack"
REQUIRES_ONE_OF="plex jellyfin"
TS_NODES="tracearr"
BACKUP_ORDER=20
# Backups: Tracearr's own backups (Settings → Backup) are left out, since the kit's hold the same
# database; checked for: the database and the node's login
BACKUP_EXCLUDE="./tracearr/backup"
BACKUP_EXPECT="tracearr/postgres/PG_VERSION tailscale-tracearr/tailscaled.state"
