DESCRIPTION="Karakeep: bookmarks, notes and saved pages, with its own Tailscale node (tailnet-only by default) and, with ollama, tags from its AI model"
KIND=optional
PROJECT=karakeep
TS_NODES="karakeep"
BACKUP_ORDER=30
# Checked for after each backup: its database (accounts, bookmarks; the saved pages are next to it
# under data/assets) and the node's login. Meilisearch's index is small and kept too.
BACKUP_EXPECT="data/db.db tailscale-karakeep/tailscaled.state"
