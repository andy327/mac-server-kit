DESCRIPTION="Open WebUI: chats with Ollama's models in a browser, with its own Tailscale node (public through Funnel by default, behind its login)"
KIND=optional
PROJECT=open-webui
REQUIRES="ollama"
TS_NODES="chat"
BACKUP_ORDER=45
# Backups: the models it downloads for documents (cache) are left out; checked for: its database
# (accounts, chats, settings) and the node's login
BACKUP_EXCLUDE="./data/cache"
BACKUP_EXPECT="data/webui.db tailscale-chat/tailscaled.state"
