DESCRIPTION="Gluetun, qBittorrent, Prowlarr, Sonarr, Radarr, Bazarr, FlareSolverr, Seerr, Homarr"
KIND=base
PROJECT=media-stack
TS_NODES="media dashboard"
BACKUP_ORDER=20
# Backups (backup-project): left out because the apps rebuild them, and checked for afterwards
BACKUP_EXCLUDE="*/MediaCover */logs */Backups ipc-socket"
BACKUP_EXPECT="sonarr/sonarr.db radarr/radarr.db prowlarr/prowlarr.db bazarr/db/bazarr.db qbittorrent/qBittorrent/qBittorrent.conf seerr/db/db.sqlite3 homarr/db/db.sqlite tailscale-media/tailscaled.state tailscale-dashboard/tailscaled.state"
# Run after a restore or an update, once everything is healthy
AFTER_START=check-media-stack
