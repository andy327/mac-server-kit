DESCRIPTION="RomM: your game library in a browser (many games play right in it), with its own Tailscale node (tailnet-only by default)"
KIND=optional
PROJECT=romm
TS_NODES="romm"
BACKUP_ORDER=10
# Backups: the covers and screenshots it fetches (resources) and its cache (redis) are left out,
# since a scan fetches them again; the games themselves (GAMES_ROOT) aren't the kit's to back up,
# like the media folders. Checked for: its database and the node's login.
BACKUP_EXCLUDE="./resources ./redis"
BACKUP_EXPECT="mariadb/ibdata1 tailscale-romm/tailscaled.state"
