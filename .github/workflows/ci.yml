# Runs on pull requests and on pushes to main. Container installs can't run here (GitHub's macOS
# runners can't run OrbStack); those are tested in a separate user account on a Mac at each
# milestone.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (macOS Intel, /bin/bash 3.2)
    # Intel, not macos-latest (Apple Silicon): GitHub's Apple Silicon pool kept cancelling the job
    # for lack of capacity. Same stock bash 3.2, and Intel target Macs get covered. GitHub supports
    # macos-15-intel until about August 2027; move back to macos-latest before then.
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Show bash version and CPU
        run: /bin/bash --version | head -n 1; uname -m
      - name: Run tests
        run: tests/run -v

  lint:
    name: Shellcheck, compose check, private-data check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history, for check-private --history
      - name: Shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck -x kit lib/*.sh tests/run tests/lib.sh tests/test-*.sh tests/check-private tests/compose-check tests/fake-docker modules/*/hooks/*
      - name: Compose check (generated projects, real docker compose config)
        run: tests/compose-check
      - name: Private-data check (files and full history)
        run: tests/check-private --history
